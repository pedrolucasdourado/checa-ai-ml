name: Eval de regressão (geração)

# Reutilizável: chamado pelo CI (PRs) e pelo release (antes de promover o prompt).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # Golden set em evals/golden.jsonl, limites em evals/thresholds.json.
      # Falha o job (e o PR) se faithfulness/abstenção/links/injection ficarem fora do limite.
      - name: Eval (faithfulness, abstenção, links, injection)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/eval_generation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-generation-report
          path: reports/eval/generation.json
          if-no-files-found: ignore
