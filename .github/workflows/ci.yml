name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # Inclui o contrato do prompt (hash/versão), guardrails e o harness do eval.
      - run: python -m pytest tests -q

  changes:
    runs-on: ubuntu-latest
    outputs:
      rag: ${{ steps.filter.outputs.rag }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rag:
              - 'src/rag/prompts.py'
              - 'src/rag/guardrails.py'
              - 'src/rag/retriever.py'
              - 'src/fact_check_service.py'
              - 'src/config.py'
              - 'evals/**'
              - 'scripts/eval_generation.py'
              - 'requirements-ci.txt'

  # Prompt, modelo, parâmetros de RAG ou guardrails mudaram → eval de regressão.
  # PRs de forks não recebem secrets: o eval é pulado e o gate abaixo avisa.
  eval:
    needs: changes
    if: >-
      needs.changes.outputs.rag == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/eval.yml
    secrets: inherit

  # Único check obrigatório na proteção da branch: verde = tests ok e (eval ok ou não necessário).
  ci-ok:
    if: always()
    needs: [tests, changes, eval]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "tests=${{ needs.tests.result }} eval=${{ needs.eval.result }}"
          [ "${{ needs.tests.result }}" = "success" ] || exit 1
          case "${{ needs.eval.result }}" in success|skipped) ;; *) exit 1 ;; esac
          if [ "${{ needs.changes.outputs.rag }}" = "true" ] && [ "${{ needs.eval.result }}" = "skipped" ]; then
            echo "::warning::Eval não rodou (PR de fork sem secrets). Um mantenedor deve rodá-lo antes do merge."
          fi
