name: Validate Langfuse prompts (staging)

# Read-only check; edits and label changes happen in Langfuse Prompt Management.
on:
  push:
    branches: [main]
    paths:
      - src/rag/prompts.py
      - src/fact_check_service.py
      - scripts/validate_prompts.py
  workflow_dispatch:

concurrency:
  group: prompts-staging-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python scripts/validate_prompts.py --label staging
