name: Deploy → Azure VM

# Roda quando o CI da main termina com sucesso (tests + eval), ou manualmente.
# 1) build da imagem e push no GHCR  2) SSH na VM: atualiza código/.env, pull + up -d
# 3) smoke test em /health.
# Rollback: Actions → "Deploy" → Run workflow informando um SHA antigo em `ref`.
# Prompt: o deploy NÃO promove o prompt; isso continua sendo o workflow "Release".
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA/branch a implantar (default: main)"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      REF: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Define tag da imagem
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepara SSH
        env:
          SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      # Pesos do BERTimbau: versionados no DVC (models/best_model_transformer.dvc), nunca na imagem
      # nem no Git. O deploy os baixa e os sincroniza (rsync, incremental) para a VM antes de subir.
      #
      # Degradação explícita: se CLASSIFIER_ENABLED=true mas os pesos não puderem ser entregues
      # (sem ponteiro .dvc, pull ou rsync falhou), o deploy NÃO é bloqueado: o classificador é
      # desligado só nesta release (output `enabled=false`), com ::warning:: e resumo do job.
      # O app segue como antes (insufficient_evidence). Para falhar o deploy nesse caso, defina
      # a variável CLASSIFIER_STRICT=true.
      - name: Sincroniza pesos do classificador (DVC → VM)
        id: classifier
        env:
          WANT: ${{ vars.CLASSIFIER_ENABLED || 'false' }}
          STRICT: ${{ vars.CLASSIFIER_STRICT || 'false' }}
          HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MODELS_DIR: ${{ vars.CLASSIFIER_MODELS_HOST_PATH || '/opt/checa-ai/models' }}
        run: |
          if [ "$WANT" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Classificador desabilitado (CLASSIFIER_ENABLED != true); nada a sincronizar."
            exit 0
          fi

          sync_weights() {
            POINTER=models/best_model_transformer.dvc
            if [ ! -f "$POINTER" ]; then
              echo "ponteiro $POINTER ausente: rode 'dvc add models/best_model_transformer && dvc push' e commite o .dvc"
              return 1
            fi
            pip install -q "dvc>=3,<4"
            if [ -n "$DAGSHUB_USER" ] && [ -n "$DAGSHUB_TOKEN" ]; then
              dvc remote modify --local origin auth basic
              dvc remote modify --local origin user "$DAGSHUB_USER"
              dvc remote modify --local origin password "$DAGSHUB_TOKEN"
            fi
            dvc pull "$POINTER"
            test -f models/best_model_transformer/config.json

            SSH="ssh -i ~/.ssh/id_deploy $VM_USER@$HOST"
            # Destino pertence ao usuário do deploy; leitura liberada ao uid do container.
            $SSH "sudo -n mkdir -p '$MODELS_DIR/best_model_transformer' && sudo -n chown -R $VM_USER '$MODELS_DIR'"
            rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
              models/best_model_transformer/ "$VM_USER@$HOST:$MODELS_DIR/best_model_transformer/"
            $SSH "chmod -R a+rX '$MODELS_DIR' \
              && test -f '$MODELS_DIR/best_model_transformer/config.json' \
              && ls '$MODELS_DIR/best_model_transformer' | grep -Eq 'model.safetensors|pytorch_model.bin'"
          }

          # bash -e separado: dentro de `if (func)` o errexit seria ignorado e um erro no meio
          # da função não a abortaria.
          if bash -euo pipefail -c "$(declare -f sync_weights); sync_weights"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "### Classificador: pesos sincronizados e ativado" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$STRICT" = "true" ]; then
            echo "::error::CLASSIFIER_ENABLED=true mas os pesos não foram entregues (CLASSIFIER_STRICT=true)."
            exit 1
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::warning::CLASSIFIER_ENABLED=true mas os pesos não foram entregues; classificador DESLIGADO nesta release. Veja o log acima."
          {
            echo "### ⚠️ Classificador desligado nesta release"
            echo "\`CLASSIFIER_ENABLED=true\`, mas não foi possível entregar os pesos à VM. O deploy seguiu sem o classificador."
            echo "Corrija o ponteiro DVC/credenciais e rode o deploy de novo, ou defina \`CLASSIFIER_STRICT=true\` para bloquear."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Atualiza código e .env na VM e sobe a nova versão
        id: up
        env:
          HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
          LANGFUSE_TRACING_ENVIRONMENT: ${{ vars.LANGFUSE_TRACING_ENVIRONMENT || 'production' }}
          PROMPT_LABEL: ${{ vars.PROMPT_LABEL || 'production' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          DOMAIN: ${{ vars.DOMAIN }}
          # valor efetivo: o passo do classificador desliga se os pesos não chegaram
          CLASSIFIER_ENABLED: ${{ steps.classifier.outputs.enabled || 'false' }}
          CLASSIFIER_BACKEND: ${{ vars.CLASSIFIER_BACKEND || 'bertimbau' }}
          CLASSIFIER_BERTIMBAU_MODEL_PATH: ${{ vars.CLASSIFIER_BERTIMBAU_MODEL_PATH || '/app/models/best_model_transformer' }}
          CLASSIFIER_MODELS_HOST_PATH: ${{ vars.CLASSIFIER_MODELS_HOST_PATH || '/opt/checa-ai/models' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          # Token do /api/v1/*: sem ele a rota ficaria aberta a qualquer container da rede interna.
          [ -n "$INTERNAL_API_TOKEN" ] || { echo "::error::secret INTERNAL_API_TOKEN não configurado"; exit 1; }

          SSH="ssh -i ~/.ssh/id_deploy $VM_USER@$HOST"

          # Imagem em execução antes do deploy (o .env abaixo a sobrescreve): alvo do rollback.
          PREV_IMAGE="$($SSH 'grep -m1 "^APP_IMAGE=" ~/checa-ai/.env 2>/dev/null | cut -d= -f2-' || true)"
          echo "PREV_IMAGE=$PREV_IMAGE" >> "$GITHUB_ENV"

          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)

          # .env montado a partir dos secrets/variables (nunca fica no repositório).
          # Variáveis vazias são omitidas, para o app usar o default do código.
          # APP_IMAGE e COMPOSE_FILE também vão para o .env: assim `docker compose ps/logs/...`
          # funciona direto na VM, sem flags (o Compose lê o .env da pasta sozinho).
          {
            for k in OPENAI_API_KEY INTERNAL_API_TOKEN TAVILY_API_KEY LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY \
                     LANGFUSE_BASE_URL LANGFUSE_TRACING_ENVIRONMENT PROMPT_LABEL LLM_MODEL DOMAIN \
                     CLASSIFIER_ENABLED CLASSIFIER_BACKEND CLASSIFIER_BERTIMBAU_MODEL_PATH \
                     CLASSIFIER_MODELS_HOST_PATH; do
              [ -n "${!k}" ] && printf '%s=%s\n' "$k" "${!k}"
            done
            printf 'APP_IMAGE=%s\n' "$IMAGE"
            printf 'COMPOSE_FILE=compose.prod.yaml\n'
          } | $SSH 'umask 077; mkdir -p ~/checa-ai && cat > ~/checa-ai/.env'

          # Código: na primeira vez inicializa o git; depois só busca o SHA. O token não é gravado em .git/config.
          $SSH "set -e; cd ~/checa-ai
            [ -d .git ] || { git init -q && git remote add origin $REPO_URL; }
            git -c http.extraheader='AUTHORIZATION: basic $AUTH' fetch --depth 1 origin $(git rev-parse HEAD)
            git checkout -qf FETCH_HEAD"

          # Login no GHCR (o token só vale durante o job; basta para o pull imediato).
          echo "$GH_TOKEN" | $SSH "docker login ghcr.io -u $GH_ACTOR --password-stdin"

          # Rede interna compartilhada com o checa-ai-backend (idempotente). --internal: sem saída
          # para a internet; app e worker têm outras redes para isso. Se já existir sem
          # --internal, só avisa (recriar exige desanexar os containers).
          $SSH 'net=checa-ai-ml-shared
            if ! docker network inspect $net >/dev/null 2>&1; then
              docker network create --internal $net
            elif [ "$(docker network inspect -f "{{.Internal}}" $net)" != true ]; then
              echo "::warning::rede $net existe sem --internal"
            fi'

          $SSH "cd ~/checa-ai && rm -f .image.env \
            && docker compose pull app \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"

      - name: Smoke test
        id: smoke
        env:
          URL: ${{ vars.APP_URL || format('http://{0}', secrets.AZURE_VM_HOST) }}
          HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ok=0
          for i in $(seq 1 12); do
            curl -fsS "$URL/health" && { ok=1; break; }
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::/health não respondeu após o deploy"; exit 1; }

          # /ready só é alcançável por dentro (não é público): confere Qdrant/coleção/embeddings.
          # Só avisa: coleção vazia no primeiro deploy não deve derrubar nem reverter a release.
          ssh -i ~/.ssh/id_deploy "$VM_USER@$HOST" "cd ~/checa-ai && docker compose exec -T app \
            python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=10)\"" \
            || echo "::warning::/ready falhou: índice Qdrant ausente ou incompatível (rode o workflow index-corpus)"

          # Exercita a mesma coleção, embeddings e limiar do serviço com alegações
          # conhecidas. Falhas interrompem o deploy e acionam o rollback da imagem.
          ssh -i ~/.ssh/id_deploy "$VM_USER@$HOST" "cd ~/checa-ai && docker compose exec -T app \
            python -m src.rag.retrieval_contract"

      # Reverte só a imagem do app para a que rodava antes (APP_IMAGE no .env da VM).
      # O job continua falhando de propósito: a release nova NÃO está no ar.
      # Prompts não são afetados (continuam por Release/Langfuse); índice Qdrant idem.
      - name: Rollback automático para a imagem anterior
        if: failure() && (steps.up.conclusion == 'failure' || steps.smoke.conclusion == 'failure')
        env:
          URL: ${{ vars.APP_URL || format('http://{0}', secrets.AZURE_VM_HOST) }}
          HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          if [ -z "$PREV_IMAGE" ] || [ "$PREV_IMAGE" = "$IMAGE" ]; then
            echo "::warning::sem imagem anterior para reverter (primeiro deploy?)"; exit 1
          fi
          SSH="ssh -i ~/.ssh/id_deploy $VM_USER@$HOST"
          $SSH "cd ~/checa-ai && sed -i 's|^APP_IMAGE=.*|APP_IMAGE=$PREV_IMAGE|' .env \
            && docker compose up -d app"
          for i in $(seq 1 12); do
            if curl -fsS "$URL/health"; then
              echo "::error::deploy de $IMAGE falhou; revertido para $PREV_IMAGE"; exit 1
            fi
            sleep 10
          done
          echo "::error::deploy falhou e o rollback para $PREV_IMAGE também não ficou saudável"; exit 1
