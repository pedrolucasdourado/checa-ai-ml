name: Release → valida prompts de produção

# Read-only release gate: evaluation and validation of labels moved in Langfuse.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: prompts-release-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    uses: ./.github/workflows/eval.yml
    secrets: inherit

  validate:
    needs: eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure "Required reviewers" neste environment (Settings > Environments).
    environment: production
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Valida staging
        run: python scripts/validate_prompts.py --label staging
      - name: Valida production
        run: python scripts/validate_prompts.py --label production
