name: Release → promove prompt para produção

# "Sobe para produção de verdade": ao publicar um Release (ou manualmente).
# 1) eval de regressão  2) aprovação do environment "production"  3) label production no Langfuse.
# Rollback: republique o release anterior (ou mova o label no Langfuse).
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: prompts-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    uses: ./.github/workflows/eval.yml
    secrets: inherit

  promote:
    needs: eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure "Required reviewers" neste environment (Settings > Environments).
    environment: production
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Garante que a versão do release existe no Langfuse
        run: python scripts/sync_prompts.py --label staging
      - name: Mostra o que será promovido
        run: python scripts/sync_prompts.py --promote --check
      - name: Promove para production
        run: python scripts/sync_prompts.py --promote
