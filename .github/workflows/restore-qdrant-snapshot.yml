name: Restaurar snapshot Qdrant (VM)

# Recuperação manual e explícita de uma coleção Qdrant a partir de um snapshot
# já existente no volume persistente da VM. Não remove volumes, snapshots ou
# containers; o Qdrant substitui apenas a coleção indicada pelo snapshot.
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Nome exato do snapshot a restaurar"
        required: true
        type: string
      confirmation:
        description: "Digite RESTORE_QDRANT para confirmar"
        required: true
        type: string

jobs:
  restore:
    if: ${{ inputs.confirmation == 'RESTORE_QDRANT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configura acesso à VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o ExitOnForwardFailure=yes -f -N \
            -L 6333:127.0.0.1:6333 "$VM_USER@$VM_HOST"

      - name: Confere snapshot e restaura coleção
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -euo pipefail
          COLLECTION="fact_checks_pt_v2_openai"
          case "$SNAPSHOT" in
            "$COLLECTION"-*.snapshot) ;;
            *) echo "Snapshot não pertence à coleção esperada" >&2; exit 1 ;;
          esac
          curl -fsS "http://127.0.0.1:6333/collections/$COLLECTION/snapshots" \
            | grep -F "\"$SNAPSHOT\"" >/dev/null
          curl -fsS -X PUT "http://127.0.0.1:6333/collections/$COLLECTION/snapshots/recover?wait=true" \
            -H 'Content-Type: application/json' \
            -d "{\"location\":\"file:///qdrant/snapshots/$COLLECTION/$SNAPSHOT\"}"
          curl -fsS "http://127.0.0.1:6333/collections/$COLLECTION"
