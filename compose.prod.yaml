# Stack de produção (VM Azure): Caddy (HTTPS) → app → Qdrant (rede interna).
# /api/v1/* é bloqueado no Caddy; o backend acessa o app via rede checa-ai-ml-shared.
# Usado por .github/workflows/deploy.yml; a imagem vem do GHCR via APP_IMAGE.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}   # sem domínio: HTTP puro na porta 80
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      CLASSIFIER_ENABLED: ${CLASSIFIER_ENABLED:-false}
      CLASSIFIER_BACKEND: ${CLASSIFIER_BACKEND:-bertimbau}
      CLASSIFIER_BERTIMBAU_MODEL_PATH: ${CLASSIFIER_BERTIMBAU_MODEL_PATH:-}
    volumes:
      # Weights stay outside Git and the image.  Provision this directory on
      # the VM before enabling the classifier.
      - ${CLASSIFIER_MODELS_HOST_PATH:-/opt/checa-ai/models}:/app/models:ro
    networks:
      default: {}
      shared:
        aliases: [ml-api]   # o worker do checa-ai-backend chama http://ml-api:8000
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # só loopback: acesso via túnel SSH para ingestão
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  # Rede interna compartilhada com o backend (criada no deploy com --internal:
  # sem saída para a internet e sem portas publicadas; só app e worker entram nela).
  shared:
    external: true
    name: checa-ai-ml-shared

volumes:
  qdrant_storage:
  caddy_data:
  caddy_config:
